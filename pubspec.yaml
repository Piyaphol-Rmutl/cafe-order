name: cafe_order
description: "ENGCE307 แอปประกอบการบรรยาย Café Order"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^18.1.4
  provider: ^6.1.5+1
  sqflite: ^2.4.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  # แพ็กเกจของเราเอง (สัปดาห์ 2) อ้างด้วย path
  cafe_core:
    path: packages/cafe_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7 # SQLite บนเครื่องคอมพิวเตอร์สำหรับ Unit Test

flutter:
  uses-material-design: true
  generate: true # สร้างคลาส AppLocalizations จากไฟล์ .arb
  # แอสเซตต้องประกาศที่นี่ก่อนใช้ Image.asset
  assets:
    - assets/images/
    - assets/menu/
