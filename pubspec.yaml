name: cafe_order
description: "ENGCE307 แอปประกอบการบรรยาย Café Order"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # แพ็กเกจของเราเอง (สัปดาห์ 2) อ้างด้วย path
  cafe_core:
    path: packages/cafe_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # แอสเซตต้องประกาศที่นี่ก่อนใช้ Image.asset
  assets:
    - assets/images/
    - assets/menu/
